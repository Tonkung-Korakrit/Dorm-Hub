version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: dorm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: dorm_booking
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dorm-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: admin
      PMA_PASSWORD: admin
      PMA_PORT: 3306
    depends_on:
      - mysql

  # backend:
  #   image: node:18-alpine
  #   container_name: dorm-backend
  #   restart: always
  #   env_file: .env
  #   depends_on:
  #     - mysql
  #   ports:
  #     - "3000:3000"

volumes:
  mysql_data:
